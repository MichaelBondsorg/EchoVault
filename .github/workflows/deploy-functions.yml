name: Deploy Cloud Functions

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firebase.json'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:  # Allows manual trigger from GitHub UI
    inputs:
      environment:
        description: 'Deploy environment'
        required: false
        default: 'production'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java for Firebase emulators
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95  # v5
        with:
          distribution: temurin
          java-version: '21'

      # The Functions test files run under the ROOT vitest config
      # (see vitest.config.js `include:` — functions/src/**/__tests__ are
      # cherry-picked into the root run), so the root suite is the gate for
      # Functions changes too. Emulator-backed rules run separately below.
      - name: Install root dependencies
        run: npm ci

      # Functions test files import firebase-functions/firebase-admin, resolved
      # from functions/node_modules — install them so the cherry-picked
      # functions/src tests can load.
      - name: Install Functions dependencies
        run: |
          cd functions
          npm ci

      - name: Run test suite (covers src/ and functions/src/)
        run: npm test

      - name: Run Firestore rules suite
        run: npm run test:rules

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: '22'

      - name: Install Functions dependencies
        run: |
          cd functions
          npm ci

      - name: Deploy to Firebase
        uses: w9jds/firebase-action@a1d77669d1c6a9e6f8b731356c6015d981569a7a  # v15.22.4
        with:
          args: deploy --only functions,firestore:rules --project echo-vault-app
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
