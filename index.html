<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <!-- Standard PWA meta tag (required for modern browsers) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Apple-specific PWA meta tags (for Safari compatibility) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#F7F6F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151618" media="(prefers-color-scheme: dark)" />
    <title>Engram</title>
    <link rel="manifest" href="/manifest.json" />

    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: Geist, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #F7F6F2;
        color: #1E1D19;
        min-height: 100vh;
        min-height: 100dvh;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Dark mode body */
      html.dark body {
        background: #151618;
        color: #F0F0EE;
      }

      html {
        scroll-behavior: smooth;
      }

      /* Custom scrollbar — warm tones */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(142, 122, 102, 0.3);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(142, 122, 102, 0.5);
      }

      /* Dark mode scrollbar */
      html.dark ::-webkit-scrollbar-thumb {
        background: rgba(212, 196, 176, 0.2);
      }
      html.dark ::-webkit-scrollbar-thumb:hover {
        background: rgba(212, 196, 176, 0.35);
      }

      /* Reduced motion preference */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <script>
      (function() {
        document.documentElement.dataset.accent = localStorage.getItem('engram-accent') || 'blue';
        var d = localStorage.getItem('engram-dark-mode');
        var isDark = d === 'dark' || (d !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        } else {
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
